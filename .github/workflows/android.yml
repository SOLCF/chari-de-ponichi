name: Android APK

# ubuntu-latest には Android SDK が入っているので、ここでの導入は不要。
# 手元に Android SDK を入れずに APK を作るための仕組み。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 「latest」リリースへ APK を貼り替えるために書き込みが要る
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # AGP 8.7 / Gradle 8.11 は JDK 21 を前提にしている
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # www/ は生成物なのでコミットしていない。ここで作る
      - name: 配信ファイルを www へ集める
        run: npm run build

      - name: Capacitor を同期する
        run: npx cap sync android

      - name: APK をビルドする
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: chari-de-ponichi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 成果物のダウンロードはログインと zip の展開が要る。
      # スマホから入れたいので、固定URLで直接落とせるリリースにも置く
      - name: 最新ビルドとして公開する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NOTES="main の最新コミットから自動生成した APK です。

          コミット: ${{ github.sha }}
          ビルド日時: $(date -u '+%Y-%m-%d %H:%M UTC')

          debug ビルドのため、ビルドごとに署名鍵が変わります。
          入れ直すときは先にアプリ内の 設定 → バックアップを保存 をしてから、
          一度アンインストールしてください。"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest --title "最新ビルド" --prerelease --notes "$NOTES"
          fi
          gh release upload latest "$APK" --clobber

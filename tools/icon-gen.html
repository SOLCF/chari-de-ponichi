<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコン生成 — チャリでポンイチ</title>
<style>
  body { background:#f7f5f0; color:#1d2430; font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
         margin:0; padding:28px; }
  h1 { font-size:19px; margin:0 0 6px; }
  p  { color:#5f6a7c; font-size:13px; line-height:1.7; margin:0 0 20px; }
  .row { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; }
  figure { margin:0; text-align:center; }
  canvas { border-radius:12px; display:block; box-shadow:0 4px 14px rgba(40,50,70,.12); }
  figcaption { font-size:11px; color:#5f6a7c; margin-top:7px; }
  button { margin-top:18px; padding:12px 22px; font-size:14px; font-weight:600; border:none;
           border-radius:999px; cursor:pointer;
           background:linear-gradient(135deg,#e07a1e,#c25f10); color:#fff; }
  .warn { color:#cf3b3b; }
</style>
</head>
<body>

<h1>アイコン生成</h1>
<p>
  下のボタンで 3 つの PNG を書き出します。ダウンロードしたファイルを
  <code>icons/</code> フォルダに置いてください。<br>
  必要なファイル名: <code>icon-192.png</code> / <code>icon-512.png</code> / <code>icon-maskable-512.png</code><br>
  地図は <code>data/japan.json</code> を読み込むので、<b>ローカルサーバ経由で開いてください</b>
  （<code>tools/serve.ps1</code> を起動して <code>/tools/icon-gen.html</code>）。<br>
  ブラウザを使わずに作り直すなら <code>tools/make-icons.ps1</code> でも同じ絵が出ます。
</p>

<div class="row">
  <figure><canvas id="c192" width="192" height="192" style="width:192px"></canvas><figcaption>192 × 192</figcaption></figure>
  <figure><canvas id="c512" width="512" height="512" style="width:192px"></canvas><figcaption>512 × 512</figcaption></figure>
  <figure><canvas id="cmask" width="512" height="512" style="width:192px"></canvas><figcaption>512 × 512 maskable</figcaption></figure>
</div>

<button type="button" id="dl">3つまとめてダウンロード</button>
<p id="status"></p>

<script>
/* 512 を基準に設計し、他のサイズは scale で追従させる。
   tools/make-icons.ps1 と同じ絵になるよう寸法を揃えてある。 */

var japan = null;

/* js/japan.js の project() と同じ等距円筒図法 */
function projectJapan(data, box) {
  var k = Math.cos((data.lat0 || 38) * Math.PI / 180);
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  var rings = data.islands.map(function (island) {
    return island.ring.map(function (p) {
      var x = p[0] * k, y = -p[1];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      return [x, y];
    });
  });
  var w = maxX - minX, h = maxY - minY;
  var scale = Math.min(box / w, box / h);
  var offX = (box - w * scale) / 2, offY = (box - h * scale) / 2;
  return rings.map(function (ring) {
    return ring.map(function (pt) {
      return [(pt[0] - minX) * scale + offX, (pt[1] - minY) * scale + offY];
    });
  });
}

function draw(canvas, maskable) {
  var S = canvas.width;
  var ctx = canvas.getContext('2d');
  var k = S / 512;
  ctx.clearRect(0, 0, S, S);

  // 背景（アプリ本体がライトテーマなので、アイコンも紙の色にする）
  ctx.save();
  if (!maskable) {
    roundRect(ctx, 0, 0, S, S, 112 * k);
    ctx.clip();
  }
  var g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#fdfcf7');
  g.addColorStop(1, '#eee8da');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.restore();

  // maskable は端が切り落とされるので、中身を安全域に収める
  ctx.save();
  ctx.translate(S / 2, S / 2);
  ctx.scale(maskable ? 0.72 : 1, maskable ? 0.72 : 1);
  ctx.translate(-S / 2, -S / 2);

  // 日本を一周する軌跡
  var ar = 214 * k;
  ctx.strokeStyle = '#e07a1e';
  ctx.lineWidth = 21 * k;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, ar, -Math.PI / 2, Math.PI * 1.05);
  ctx.stroke();

  // 日本列島。塗りだけだとシルエットになるので、海岸線の線を重ねて地図らしくする
  if (japan) {
    var box = 300 * k;
    var off = (S - box) / 2;
    ctx.beginPath();
    projectJapan(japan, box).forEach(function (ring) {
      ring.forEach(function (pt, i) {
        var x = pt[0] + off, y = pt[1] + off;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
    });
    ctx.fillStyle = '#c3dd85';
    ctx.fill();
    ctx.strokeStyle = '#7ba63c';
    ctx.lineWidth = 4.5 * k;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // 自転車。置き場所は房総沖の太平洋。列島は右上(北海道)から左下(九州)へ
  // 斜めに走るので、右下は海しかない。ここなら四国も九州も隠れない。
  // 地図の上に重なるため、まず紙色で太く縁取ってから本体を描く
  ctx.save();
  ctx.translate(318 * k, 348 * k);
  ctx.scale(0.58, 0.58);
  ctx.translate(-256 * k, -308 * k);
  drawBike(ctx, k, '#fdfcf7', 16 * k);
  drawBike(ctx, k, '#2b3444', 0);
  ctx.restore();

  // 現在地のドット。地図にも自転車にも隠れないよう最後に描く
  var ang = Math.PI * 1.05;
  var dx = S / 2 + Math.cos(ang) * ar;
  var dy = S / 2 + Math.sin(ang) * ar;
  ctx.fillStyle = '#fdfcf7';
  ctx.beginPath(); ctx.arc(dx, dy, 25 * k, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e07a1e';
  ctx.beginPath(); ctx.arc(dx, dy, 17 * k, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

/* 自転車。extra に太さを足すと、本体の下に敷く縁取りになる。
   512 を基準とした座標で、車輪は (172,322) と (340,322)、半径 66。 */
function drawBike(ctx, k, color, extra) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.lineWidth = 17 * k + extra;
  [172, 340].forEach(function (cx) {
    ctx.beginPath();
    ctx.arc(cx * k, 322 * k, 66 * k, 0, Math.PI * 2);
    ctx.stroke();
  });

  // シートステー / シートチューブ / チェーンステー / ダウンチューブ / フォーク / トップチューブ
  ctx.lineWidth = 18 * k + extra;
  ctx.beginPath();
  ctx.moveTo(172 * k, 322 * k); ctx.lineTo(252 * k, 236 * k);
  ctx.lineTo(258 * k, 322 * k); ctx.lineTo(172 * k, 322 * k);
  ctx.moveTo(258 * k, 322 * k); ctx.lineTo(330 * k, 240 * k);
  ctx.lineTo(340 * k, 322 * k);
  ctx.moveTo(252 * k, 236 * k); ctx.lineTo(330 * k, 240 * k);
  ctx.stroke();

  // サドルとハンドル
  ctx.lineWidth = 16 * k + extra;
  ctx.beginPath();
  ctx.moveTo(232 * k, 228 * k); ctx.lineTo(272 * k, 228 * k);
  ctx.moveTo(316 * k, 230 * k); ctx.lineTo(352 * k, 230 * k);
  ctx.stroke();

  // クランク
  ctx.beginPath();
  ctx.arc(258 * k, 322 * k, 14 * k + extra / 2, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawAll() {
  draw(document.getElementById('c192'), false);
  draw(document.getElementById('c512'), false);
  draw(document.getElementById('cmask'), true);
}

drawAll();
fetch('../data/japan.json')
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (j) { japan = j; drawAll(); })
  .catch(function () {
    document.getElementById('status').innerHTML =
      '<span class="warn">data/japan.json を読み込めませんでした。' +
      'ローカルサーバ経由で開いてください（file:// では読めません）。</span>';
  });

function save(canvasId, name) {
  var a = document.createElement('a');
  a.href = document.getElementById(canvasId).toDataURL('image/png');
  a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

document.getElementById('dl').addEventListener('click', function () {
  save('c192', 'icon-192.png');
  setTimeout(function () { save('c512', 'icon-512.png'); }, 250);
  setTimeout(function () { save('cmask', 'icon-maskable-512.png'); }, 500);
});
</script>
</body>
</html>
